name: check-and-test

on:
  - pull_request

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.gitea/actions/go-setup
      - name: lint
        run: make lint
      - name: test
        run: make test
      - name: build
        run: make build
      - name: security-check
        run: make security-check
